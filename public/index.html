<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- 自分のJS -->
    <link rel="stylesheet" href="style.css">



</head>

<body>

    <div id="map"></div>

<div id="uploadButtonWrapper">

  <button id="uploadToggleButton"
          type="button"></button>

  <div id="uploadTooltip">
    音をアップロードする
  </div>




</div>






<div id="filterButtonWrapper">
  <button id="filterToggleButton"></button>
  <div id="filterTooltip">音をフィルタリングする</div>
</div>

<div id="filter-ui">
  <p>表示する音の日時</p>


<label>
  開始年
  <input type="number" id="filterStartYear">
</label>

<label>
  終了年
  <input type="number" id="filterEndYear">
</label>


<label>
  開始月
  <input type="number" id="filterStartMonth" min="1" max="12">
</label>

<label>
  終了月
  <input type="number" id="filterEndMonth" min="1" max="12">
</label>



 <label>
  開始時刻
  <input type="time" id="filterStartTime">
</label>

<label>
  終了時刻
  <input type="time" id="filterEndTime">
</label>


  <button id="applyFilterButton">絞り込む</button>
  <button id="resetFilterButton">リセット</button>
</div>






    <div id="upload-ui">
        <h2>音をアップロード</h2>

        <div class="upload-step" id="step-file">
            <p>1. 音声ファイルを選択してください</p>
            <input id="audioInput" type="file" accept=".mp3,.m4a,.wav,audio/mpeg,audio/mp4,audio/wav,audio/*,video/*">
            <button id="fileNextButton" type="button">次へ</button>
        </div>

        <div class="upload-step" id="step-date">
            <p>2. 録音日を選択してください</p>
            <input type="datetime-local" id="recordedAtInput">
            <button id="dateNextButton" type="button">次へ</button>
        </div>

        <div class="upload-step" id="step-user">
            <p>3. ユーザー名を記入してください</p>
            <input type="text" id="userNameInput" value="名無しさん">
            <button id="userNextButton" type="button">次へ</button>
        </div>

        <div class="upload-step" id="step-text">
            <p>4. コメントを書いてください</p>
            <input type="text" id="soundTextInput" placeholder="キャプション">
            <button id="textNextButton" type="button">
                次へ
            </button>
        </div>

        <p id="upload-status">
            音声ファイルを選択してください
        </p>
    </div>


    <!--Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- 自分のJS -->
    <script src="app.js"></script>








</body>

</html>
